<!DOCTYPE html>

<title>金句卡片</title>

<style>
body{background:#15161a;font-family:Georgia,"Songti SC","SimSun",serif}
.doc--tpl-ext{width:680px;max-width:100%;margin:48px auto 72px;padding:64px 56px 56px;border-left:3px solid #d4a94a;background:#1c1e24;border-radius:2px}

.doc--tpl-ext p{font-size:15px;line-height:1.9;margin:18px 0;color:#a9a49a;text-align:center}
.doc--tpl-ext p:first-of-type{font-size:13px;color:#d4a94a;letter-spacing:3px;text-transform:uppercase}
.doc--tpl-ext hr{border:0;border-top:1px solid #34373f;margin:36px auto;width:64px}
.doc--tpl-ext blockquote{margin:28px 0 0;padding:0;background:none;border:0;text-align:center}
@media(max-width:740px){.doc--tpl-ext{width:100%;margin:0;padding:48px 24px 40px;border-left:0;border-top:3px solid #d4a94a;border-radius:0}}
</style>
</head>
<body data-mode="default">
<article class="doc doc--tpl-ext">
<p><span style="font-size: 13px; color: #d4a94a;">每日一句</span></p>
<h1><span style="font-size: 24px;">把复杂的事情做简单，<br />把简单的事情做彻底。</span></h1>
<hr>
<blockquote><span style="font-size: 15px; color: #a9a49a;">—— 出处 / 作者</span></blockquote>
